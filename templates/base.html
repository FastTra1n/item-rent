{% load static %}

<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Сервис аренды вещей{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}" />
  </head>
  <body>
    <div class="container text-center">
      <img
        src="{% static 'homepage/img/logo.svg' %}"
        alt="Rently"
        class="rently-logo"
      />

      {% include "includes/navigation.html" %}

      <main class="container my-4">{% block content %} {% endblock %}</main>

      <footer class="container text-center mt-4 mb-3 text-muted">
        <p>&copy; <span id="current-year"></span> Rently</p>
      </footer>

      <script src="{% static 'homepage/js/main.js' %}"></script>
    </div>
  </body>
</html>
