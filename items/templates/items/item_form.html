{% extends "base.html" %}

{% block title %}Добавление вещи{% endblock %}

{% block content %}
<h1>Добавление вещи</h1>

<form
  method="post"
  enctype="multipart/form-data"
  class="text-start"
>
  {% csrf_token %}

  {{ form.as_p }}

  <button type="submit" class="btn btn-primary">
    Сохранить
  </button>

  <a
    href="{% url 'items:list' %}"
    class="btn btn-outline-secondary"
  >
    К каталогу
  </a>
</form>
{% endblock %}
