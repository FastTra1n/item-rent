<div class="col-md-4">
  <article class="card item-card mb-3 shadow-sm">
    <div class="card-body">
      <h5 class="card-title">{{ item.name|default:"Без названия"|truncatewords:4 }}</h5>
      <p class="card-text"><strong>ID:</strong> {{ item.id }}</p>
      <a
        href="{{ item.get_absolute_url }}"
        class="btn btn-outline-primary btn-sm"
        >Подробнее</a
      >
    </div>
  </article>
</div>
